name: Publish the farm app to GitHub Pages
# Publishes DouValue Farm Manager to https://samebimo10-cpu.github.io/DouValue-Farms/
# whenever the app, the sync server or the rules change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      # The sync server and its setup page are published alongside the app, so a
      # change to either has to reach the site.
      - "server/**"
      - "rules/**"
      - "scripts/assemble_site.sh"
      - ".github/workflows/publish-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: ./scripts/assemble_site.sh _site

      # Publishing needs GitHub Pages switched on once: repository Settings -> Pages ->
      # "Build and deployment" -> Source: "GitHub Actions". Until then these steps are skipped.
      - name: Check whether GitHub Pages is enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.pages.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v4
      - if: steps.pages.outcome == 'success'
        run: echo "Farm app published to ${{ steps.deploy.outputs.page_url }}"
      - if: steps.pages.outcome != 'success'
        run: echo "::warning::GitHub Pages is not enabled yet. Open Settings -> Pages and set Source to 'GitHub Actions', then re-run this workflow."
