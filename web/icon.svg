    <path d="M31 19h7l3-3"/><path d="M31 25h10l3-3"/><path d="M31 31h6"/>
  </g>
  <g fill="#8FD14F"><circle cx="42.6" cy="14.6" r="2"/><circle cx="45.6" cy="20.6" r="2"/><circle cx="38.6" cy="31" r="2"/></g>
  <g stroke="#BFE9FA" stroke-width="1.9" fill="none" stroke-linecap="round">
    <path d="M31 37h7l3 3"/><path d="M31 43h5"/>
  </g>
  <g fill="#BFE9FA"><circle cx="42.4" cy="41.4" r="2"/><circle cx="37.6" cy="43" r="2"/></g>
</svg>
