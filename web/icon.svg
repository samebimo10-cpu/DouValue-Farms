<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DouValue Farms">
  <defs>
    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1F8A3B"/><stop offset="1" stop-color="#7FC241"/>
    </linearGradient>
    <linearGradient id="leafBlue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#15559E"/><stop offset="1" stop-color="#35C2E8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#16305C"/>
  <!-- green half: the living leaf -->
  <path d="M31 10c-9 6-17 13-17 24 0 8 6 14 14 14 1 0 2 0 3-.3V10z" fill="url(#leafGreen)"/>
  <!-- blue half: the data side -->
